<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfect Web Calculator</title>
</head>
<body>
  <div  class="calculator">
  <input type="text" id="display" readonly value="0">

  <div class="button-grid">
  <button class="btn clear" onclick="clearScreen()">C</button>
  <button class="btn special" onclick="appendOperator('%')">%</button>
  <button class="btn special" onclick="deleteLast()">⌫</button>
  <button class="btn operator" onclick="appendOperator('/')">÷</button>


  <button class="btn number" onclick="appendNumber('7')">7</button>
  <button class="btn number" onclick="appendNumber('8')">8</button>
  <button class="btn number" onclick="appendNumber('9')">9</button>
  <button class="btn operator" onclick="appendOperator('*')">x</button>

  
  <button class="btn number" onclick="appendNumber('4')">4</button>
  <button class="btn number" onclick="appendNumber('5')">5</button>
  <button class="btn number" onclick="appendNumber('6')">6</button>
  <button class="btn operator" onclick="appendOperator('-')">-</button>


  <button class="btn number" onclick="appendNumber('1')">1</button>
  <button class="btn number" onclick="appendNumber('2')">2</button>
  <button class="btn number" onclick="appendNumber('3')">3</button>
  <button class="btn operator" onclick="appendOperator('+')">+</button> 
 

  <button class="btn number" onclick="appendNumber('00')">00</button>
  <button class="btn number" onclick="appendNumber('0')">0</button>
  <button class="btn number" onclick="appendNumber('.')">.</button>
  <button class="btn equal" onclick="calculate()">=</button>
  </div>

  </div>
  
<style>
  body {
  	display: flex;
  	justify-content: center;
  	align-items: center;
  	height: 100vh;
  	margin: 0;
  	background-color: #17171c;
  }
  .calculator {
  	width: 320px;
  	background-color: #000000;
  	padding: 20px;
  	border-radius: 24px;
  }
  .number {
  	background-color: #2e2f38;
  	color: #ffffff;
  }
  .clear, .special {
  background-color: #4e505f;
  color: #ffffff;
  }
  .operator, .equal {
  background-color: #ff9f04;
  color: #ffffff;
  }
 .btn {
 	height: 65px;
 	border-radius: 50%;
 	font-size: 24px;
  }
 .button-grid {
 	display: grid;
 	grid-template-columns: repeat(4, 1fr);
 	gap: 12px;
  }
  #display {
  	width: 100%;
  	height: 120px;
  	border: none;
  	background: transparent;
  	color: #ffffff;
  	font-size: 75px !important;
  	font-weight: 300;
  	text-align: right;
  	padding: 10px 20px;
  	box-sizing: border-box;
  	margin-bottom: 25px;
  	outline: none;
  }
 
</style>

<script>

  let display = document.getElementById('display');
  let resetOnNextInput = false;

  function appendNumber (num) {
   if (display.value === "" || display.value === "Error" || resetOnNextInput) {
  	display.value = num;
    resetOnNextInput = false;
   } else {
  	display.value += num;
   }
  }
  function clearScreen() {
 	display.value = "";
  }
  function appendOperator(op) {
  if (display.value === "") return;
  resetOnNextInput = false;
  
   display.value += op;
  }
  function calculate() {
  	try{
  	let equation = display.value;
  	if (equation.includes('%')) {
  		equation = equation.replace(/%/g, '/100')
  	}
   display.value = eval(equation);   
   resetOnNextInput = true;
       } catch (error) {
        display.value = "Error";
      }
  }
   function deleteLast() {
  	if (display.value.length > 1 && display.value !== "Error") {
  		display.value = display.value.slice(0, -1);
  	} else {
  	  display.value = "";
  	}
  }
</script>

</body>
</html>
