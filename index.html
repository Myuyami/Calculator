<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablet Calculator</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #121212; font-family: sans-serif; }
        .calc { background: #222; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        input { width: 100%; height: 50px; background: #333; border: none; color: #fff; font-size: 24px; text-align: right; padding: 5px; box-sizing: border-box; border-radius: 5px; margin-bottom: 15px; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { padding: 20px; font-size: 18px; border: none; border-radius: 5px; cursor: pointer; background: #444; color: #fff; }
        button.operator { background: #ff9500; }
        button.clear { background: #d9534f; }
    </style>
</head>
<body>
    <div class="calc">
        <input type="text" id="screen" readonly>
        <div class="buttons">
            <button class="clear" onclick="clearScreen()">C</button>
            <button onclick="press('/')" class="operator">/</button>
            <button onclick="press('x')" class="operator">*</button>
            <button onclick="press('-')" class="operator">-</button>
            <button onclick="press('7')">7</button>
            <button onclick="press('8')">8</button>
            <button onclick="press('9')">9</button>
            <button onclick="press('+')" class="operator">+</button>
            <button onclick="press('4')">4</button>
            <button onclick="press('5')">5</button>
            <button onclick="press('6')">6</button>
            <button onclick="calculate()" class="operator" style="grid-row: span 2; height: 100%;">=</button>
            <button onclick="press('1')">1</button>
            <button onclick="press('2')">2</button>
            <button onclick="press('3')">3</button>
            <button onclick="press('0')" style="grid-column: span 2;">0</button>
            <button onclick="press('.')">.</button>
        </div>
    </div>
    <script>
        let scr = document.getElementById('screen');
        function press(val) { scr.value += val; }
        function clearScreen() { scr.value = ''; }
        function calculate() { try { scr.value = eval(scr.value); } catch { scr.value = 'Error'; } }
    </script>
</body>
</html>
